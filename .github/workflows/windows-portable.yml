name: Windows Portable EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release-Version, z. B. v1.0.0. Leer lassen, wenn nur ein Test-Build erstellt werden soll."
        required: false
        type: string
      release_notes:
        description: "Optionaler Infotext fuer den GitHub Release."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Release-Version pruefen
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          Write-Host "Pruefe Release-Version $env:RELEASE_VERSION gegen origin."
          Write-Host "Vorhandene Tags:"
          git ls-remote --tags origin

          $existingTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_VERSION"
          if (-not [string]::IsNullOrWhiteSpace($existingTag)) {
            Write-Error "Die Release-Version $env:RELEASE_VERSION existiert bereits. Bitte eine neue Version angeben."
            exit 1
          }

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: JUnit-Tests ausfuehren
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Portable Windows-Paket bauen
        shell: pwsh
        run: ./scripts/build-portable-windows.ps1 -Version "${{ inputs.release_version || github.ref_name }}"

      - name: Portable Ordner als Artifact bereitstellen
        uses: actions/upload-artifact@v6
        with:
          name: Yazio-Overview-Windows-Portable
          path: dist/Yazio Overview/

      - name: Release-Tag erstellen
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.release_version }}"
          git push origin "${{ inputs.release_version }}"

      - name: Release-Text vorbereiten
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            "Portable Windows-Version $env:RELEASE_VERSION" | Set-Content -Path release-notes.txt -Encoding UTF8
          } else {
            $env:RELEASE_NOTES | Set-Content -Path release-notes.txt -Encoding UTF8
          }

      - name: GitHub Release erstellen
        if: github.event_name == 'workflow_dispatch' && inputs.release_version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_version }}
          name: Yazio Overview ${{ inputs.release_version }}
          body_path: release-notes.txt
          files: dist/Yazio-Overview-Windows-Portable.zip
