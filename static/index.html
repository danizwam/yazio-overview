<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yazio Overview</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="topbar">
      <div>
        <p class="eyebrow">Kalorientracker Export</p>
        <h1>Yazio Overview</h1>
      </div>
      <div class="status-card" id="statusCard">
        <span class="status-dot"></span>
        <span id="statusText">Lade Status...</span>
      </div>
    </section>

    <nav class="main-nav" aria-label="Bereiche">
      <button class="nav-tab active" type="button" data-page="analysis">Auswertung</button>
      <button class="nav-tab" type="button" data-page="sync">Yazio Import</button>
      <button class="nav-tab" type="button" data-page="profile">Profil</button>
      <button class="nav-tab" type="button" data-page="admin">Admin</button>
    </nav>

    <section id="page-analysis" class="page-section active">
      <section class="analysis-layout">
        <aside class="panel">
          <h2>Datenbestand</h2>
          <dl class="meta-grid">
            <div>
              <dt>Produkte</dt>
              <dd id="productCount">-</dd>
            </div>
            <div>
              <dt>Tage</dt>
              <dd id="dayCount">-</dd>
            </div>
            <div>
              <dt>Zeitraum</dt>
              <dd id="dateRange">-</dd>
            </div>
          </dl>
        </aside>

        <section class="panel controls-panel">
          <div class="tabs" role="tablist">
            <button class="tab active" type="button" data-mode="single">Ein Tag</button>
            <button class="tab" type="button" data-mode="range">Datumsbereich</button>
          </div>

          <form id="singleForm" class="query-form">
            <label>
              <span>Datum</span>
              <input id="singleDate" type="date" required>
            </label>
            <button type="button" class="today-button" data-target="singleDate">Heute</button>
            <button type="submit">Tag anzeigen</button>
          </form>
          <div id="singleExports" class="export-actions">
            <button type="button" data-export="xlsx" data-scope="single">Tag als Excel</button>
            <button type="button" data-export="pdf" data-scope="single">Tag als PDF</button>
          </div>

          <form id="rangeForm" class="query-form hidden">
            <label>
              <span>Von</span>
              <input id="fromDate" type="date" required>
            </label>
            <button type="button" class="today-button" data-target="fromDate">Heute</button>
            <label>
              <span>Bis</span>
              <input id="toDate" type="date" required>
            </label>
            <button type="button" class="today-button" data-target="toDate">Heute</button>
            <button type="submit">Bereich anzeigen</button>
          </form>
          <div id="rangeExports" class="export-actions hidden">
            <button type="button" data-export="xlsx" data-scope="range">Bereich als Excel</button>
            <button type="button" data-export="pdf" data-scope="range">Bereich als PDF</button>
          </div>
        </section>
      </section>

      <section id="results" class="results"></section>
    </section>

    <section id="page-sync" class="page-section">
      <section class="panel">
        <h2>Yazio Import</h2>
        <form id="syncForm" class="settings-form">
          <label>
            <span>Sync von</span>
            <input id="syncFromDate" type="date" required>
          </label>
          <button type="button" class="today-button" data-target="syncFromDate">Heute</button>
          <label>
            <span>Sync bis</span>
            <input id="syncToDate" type="date" required>
          </label>
          <button type="button" class="today-button" data-target="syncToDate">Heute</button>
          <button type="submit">Yazio synchronisieren</button>
        </form>
      </section>
    </section>

    <section id="page-profile" class="page-section">
      <section class="panel">
        <h2>Persönliche Informationen</h2>
        <form id="settingsForm" class="settings-form">
          <label>
            <span>Name</span>
            <input id="profileName" type="text" autocomplete="name">
          </label>
          <label>
            <span>Geburtsdatum</span>
            <input id="birthDate" type="date">
          </label>
          <label>
            <span>Yazio Benutzername</span>
            <input id="yazioUsername" type="email" autocomplete="username">
          </label>
          <label>
            <span>Yazio Passwort</span>
            <input id="yazioPassword" type="password" autocomplete="current-password">
          </label>
          <button type="submit">Einstellungen speichern</button>
        </form>
      </section>
    </section>

    <section id="page-admin" class="page-section">
      <section class="panel">
        <h2>Admin</h2>
        <form id="uploadForm" class="settings-form">
          <label>
            <span>products.json</span>
            <input type="file" name="products" accept="application/json,.json">
          </label>
          <label>
            <span>days.json</span>
            <input type="file" name="days" accept="application/json,.json">
          </label>
          <button type="submit">Upload speichern</button>
        </form>
      </section>
    </section>

    <section id="message" class="message hidden"></section>
  </main>

  <template id="dayTemplate">
    <article class="day-card">
      <header class="day-header">
        <div>
          <p class="eyebrow">Tag</p>
          <h2></h2>
        </div>
        <button type="button" class="copy-day">Tag kopieren</button>
      </header>
      <div class="macro-strip"></div>
      <label class="note-field">
        <span>Besonderheiten an diesem Tag</span>
        <input class="day-note" type="text">
      </label>
      <div class="meals"></div>
    </article>
  </template>

  <template id="mealTemplate">
    <section class="meal-card">
      <header>
        <h3></h3>
        <button type="button" class="copy-meal">Mahlzeit kopieren</button>
      </header>
      <div class="meal-total"></div>
      <div class="food-list"></div>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
